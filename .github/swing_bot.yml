name: Daily Multi-Day Swing Screener

on:
  schedule:
    # 20:30 UTC = 4:30 PM EDT. Runs Monday (1) through Friday (5).
    - cron: '30 20 * * 1-5'
  workflow_dispatch: # This adds the manual trigger button

jobs:
  scan-market:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinning to 3.12 to prevent the pandas-ta install crash
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Swing Screener Bot
        env:
          # These pull directly from your GitHub Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python swing_bot.py
        
