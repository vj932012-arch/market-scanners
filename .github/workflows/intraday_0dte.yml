name: Intraday 0DTE Spread Scanner

on:
  schedule:
    # Runs at minute 0 and 30 past every hour from 14:00 to 20:00 UTC (10:00 AM - 4:00 PM EDT)
    # Monday through Friday (1-5)
    - cron: '*/30 14-20 * * 1-5'
  workflow_dispatch: # Allows manual triggering from GitHub Actions UI

jobs:
  scan-intraday:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned to 3.12 to prevent pandas-ta dependency crashes
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python intraday_0dte_bot.py
