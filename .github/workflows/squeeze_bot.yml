name: Hourly TTM Squeeze Scanner

on:
  schedule:
    # Runs at minute 0 past every hour from 10:00 AM to 4:00 PM Eastern Time
    # Mon-Fri (1-5)
    - cron: '0 10-16 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch: # Allows you to manually trigger a scan anytime

jobs:
  scan-intraday-squeeze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pin to 3.12 to prevent the pandas-ta install crash
          python-version: '3.12' 

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Squeeze Bot
        env:
          # Reusing your existing GitHub Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python squeeze_bot.py
