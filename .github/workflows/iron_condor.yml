name: Iron Condor Bot Alerts

on:
  schedule:
    # Run every 15 minutes during market hours (9:30 AM - 4:00 PM ET)
    - cron: '*/15 14-20 * * 1-5'  # 9:30 AM - 4:00 PM ET (14:00 - 20:00 UTC), Mon-Fri
  
  workflow_dispatch:  # Manual trigger

jobs:
  iron-condor-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: implement-iron-condor-tracker
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Iron Condor Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python iron_condor_bot.py once
      
      - name: Log Analysis Result
        if: always()
        run: |
          echo "✓ Iron Condor scan completed at $(date)"
