name: Iron Condor Bot Alerts

on:

  workflow_dispatch:  # Manual trigger

jobs:
  iron-condor-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
            - name: Run Iron Condor Analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }} # <--- Add this line
        run: python iron_condor_bot.py
      
      - name: Log Analysis Result
        if: always()
        run: |
          echo "✓ Iron Condor scan completed at $(date)"
